<section class="ai-card p-5 sm:p-6" data-topik="{{ topik }}" aria-live="polite">
    <header class="flex items-start justify-between gap-3">
        <div>
            <h3 class="text-[15px] font-bold text-ink">{{ judul }}</h3>
            <p class="mt-0.5 text-xs text-muted">Dirangkum dari data pasar di dashboard ini</p>
        </div>
        <button type="button" class="ai-refresh btn btn-secondary btn-sm shrink-0" aria-label="Jelaskan ulang: {{ judul }}">
            <svg class="ic"><use href="#i-refresh"/></svg>
            <span class="hidden sm:inline">Jelaskan ulang</span>
        </button>
    </header>

    <div class="ai-body mt-4 text-[14px] leading-relaxed text-slate-700">
        <div class="space-y-2.5">
            <div class="shimmer h-3 w-11/12 rounded"></div>
            <div class="shimmer h-3 w-9/12 rounded"></div>
            <div class="shimmer h-3 w-10/12 rounded"></div>
        </div>
    </div>

    <footer class="mt-5 border-t border-line pt-3">
        <p class="ai-meta text-xs text-muted">Menyiapkan penjelasan…</p>
        <p class="mt-1 text-xs text-muted">Penjelasan dibantu AI dan bisa keliru. Periksa kembali dengan data asli.</p>
    </footer>
</section>
