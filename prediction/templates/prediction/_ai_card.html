<div class="ai-card relative overflow-hidden rounded-3xl border border-violet-200/70 bg-gradient-to-br from-violet-50 via-white to-orange-50 p-5 sm:p-6" data-topik="{{ topik }}">
    <div class="pointer-events-none absolute -right-10 -top-10 h-32 w-32 rounded-full bg-violet-300/20 blur-2xl"></div>
    <div class="relative flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
            <div class="flex h-8 w-8 items-center justify-center rounded-xl bg-gradient-to-br from-violet-500 to-fuchsia-500 text-white shadow-md shadow-violet-500/30">
                <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9L12 2zm7 11l.9 2.6 2.6.9-2.6.9L19 20l-.9-2.6-2.6-.9 2.6-.9L19 13zM5 15l.7 1.8 1.8.7-1.8.7L5 20l-.7-1.8-1.8-.7 1.8-.7L5 15z"/></svg>
            </div>
            <div>
                <p class="text-sm font-bold text-stone-900">{{ judul }}</p>
                <p class="text-[11px] text-stone-500">Penjelasan otomatis dengan bahasa sederhana</p>
            </div>
        </div>
        <span class="inline-flex items-center gap-1 rounded-full border border-violet-200 bg-white/80 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-violet-700">
            ✨ Generated by AI
        </span>
    </div>

    <div class="ai-body relative mt-4 text-sm leading-relaxed text-stone-700">
        <div class="space-y-2">
            <div class="h-3 w-11/12 animate-pulse rounded bg-violet-100"></div>
            <div class="h-3 w-9/12 animate-pulse rounded bg-violet-100"></div>
            <div class="h-3 w-10/12 animate-pulse rounded bg-violet-100"></div>
        </div>
    </div>

    <div class="relative mt-4 flex flex-wrap items-center justify-between gap-2 border-t border-violet-100 pt-3 text-[11px] text-stone-400">
        <span class="ai-meta">Menunggu AI...</span>
        <button type="button" class="ai-refresh inline-flex items-center gap-1 rounded-lg px-2 py-1 font-semibold text-violet-600 hover:bg-violet-100">
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M5.6 15A7 7 0 0018.4 15M18.4 9A7 7 0 005.6 9"/></svg>
            Jelaskan ulang
        </button>
    </div>
    <p class="relative mt-2 text-[10px] italic text-stone-400">Penjelasan dibuat oleh AI dan bisa keliru — selalu cek ulang dengan data asli.</p>
</div>
