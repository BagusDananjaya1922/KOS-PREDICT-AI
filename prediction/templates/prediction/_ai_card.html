<div class="ai-card relative overflow-hidden rounded-[1.75rem] border border-brand-200 p-5 sm:p-6"
     style="background:linear-gradient(165deg,#F0E8E1 0%,#FBF7F2 55%,#FBF7F2 100%)"
     data-topik="{{ topik }}">
    <div class="pointer-events-none absolute -right-12 -top-12 h-44 w-44 rounded-full bg-brand-500/15 blur-3xl"></div>
    <div class="pointer-events-none absolute -bottom-16 -left-10 h-40 w-40 rounded-full bg-brand-200/30 blur-3xl"></div>

    <!-- Header -->
    <div class="relative flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <div class="orb" aria-hidden="true"></div>
            <div>
                <p class="text-sm font-bold text-ink">{{ judul }}</p>
                <p class="text-[11px] text-stone-500">Penjelasan otomatis dengan bahasa sederhana</p>
            </div>
        </div>
        <span class="inline-flex items-center gap-1.5 rounded-full border border-brand-200 bg-white/80 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-brand-700">
            <svg class="h-3 w-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9L12 2zm7 11l.9 2.6 2.6.9-2.6.9L19 20l-.9-2.6-2.6-.9 2.6-.9L19 13z"/></svg>
            Dibantu AI
        </span>
    </div>

    <!-- Isi penjelasan -->
    <div class="ai-body relative mt-5 text-[13.5px] leading-relaxed text-stone-700">
        <div class="space-y-2.5">
            <div class="shimmer h-3 w-11/12 rounded-full"></div>
            <div class="shimmer h-3 w-9/12 rounded-full"></div>
            <div class="shimmer h-3 w-10/12 rounded-full"></div>
        </div>
    </div>

    <!-- Footer ala kotak prompt -->
    <div class="relative mt-5 flex flex-wrap items-center justify-between gap-2 rounded-2xl border border-white bg-white/80 py-2 pl-3.5 pr-2 shadow-[0_8px_24px_-14px_rgba(128,64,43,.25)]">
        <span class="ai-meta text-[11px] text-stone-400">Menyiapkan penjelasan...</span>
        <button type="button" class="ai-refresh inline-flex items-center gap-1.5 rounded-full bg-ink px-3 py-1.5 text-[11px] font-semibold text-white transition hover:bg-[#2b2820] active:scale-95">
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M5.6 15A7 7 0 0018.4 15M18.4 9A7 7 0 005.6 9"/></svg>
            Jelaskan ulang
        </button>
    </div>
    <p class="relative mt-3 text-[10px] italic text-stone-400">Penjelasan dibantu AI dan bisa keliru — selalu cek ulang dengan data asli.</p>
</div>
